<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>么么英语</title>
  <!-- 字体已改为本地自托管：Google Fonts 在国内加载不稳定，会影响首次打开的等待时间 -->
  <meta name="theme-color" content="#F5F4FB" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="么么英语" />
  <link rel="stylesheet" href="style.css" />
  <!-- 51la 访问统计：仅用于了解网站是否有家长访问，不影响练习功能 -->
  <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
  <script>LA.init({id:"3RaN3HtZUuZpInWY",ck:"3RaN3HtZUuZpInWY"})</script>
</head>
<body>
  <div class="bg-blob blob-a" aria-hidden="true"></div>
  <div class="bg-blob blob-b" aria-hidden="true"></div>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true"><img src="durian-logo.png" alt=""></div>
        <div>
          <h1>么么英语</h1>
          <p class="tagline">敲着敲着，就会了</p>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="练习模块">
        <button type="button" class="tab is-active" data-tab="word" role="tab" aria-selected="true">单词默写</button>
        <button type="button" class="tab" data-tab="sentence" role="tab" aria-selected="false">句子默写</button>
        <button type="button" class="tab" data-tab="grammar" role="tab" aria-selected="false">语法练习</button>
        <button type="button" class="tab" data-tab="review" role="tab" aria-selected="false">错题复习</button>
      </nav>
      <button type="button" class="ghost-btn reset-btn" id="resetBtn" title="清空本地进度与错题">
        <svg class="reset-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.34 5.66" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21v-4h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        重置进度
      </button>
    </header>
    <section class="toolbar" id="mainToolbar">
      <div class="field">
        <span>题库</span>
        <div class="select select-sm" id="categorySelect">
          <button type="button" class="select-trigger" id="categorySelectTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="select-value">加载中…</span>
          </button>
          <ul class="select-menu" id="categorySelectMenu" role="listbox"></ul>
        </div>
        <div class="select" id="bankSelect">
          <button type="button" class="select-trigger" id="bankSelectTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="select-value">加载中…</span>
          </button>
          <ul class="select-menu" id="bankSelectMenu" role="listbox"></ul>
        </div>
      </div>
      <button type="button" class="ghost-btn" id="loadBankBtn">加载题库</button>
      <div class="toolbar-actions">
        <button type="button" class="ghost-btn icon-btn" id="soundBtn" title="播放发音"><img src="sound-icon.png" alt="发音" class="btn-icon">发音</button>
        <button type="button" class="ghost-btn" id="hintBtn" title="显示答案3秒，自动加入错题本">提示</button>
        <button type="button" class="ghost-btn" id="skipBtn" title="跳过当前题">跳过</button>
      </div>
    </section>
    <section class="toolbar review-toolbar hidden" id="reviewToolbar">
      <div class="chip-group" role="tablist" aria-label="错题类型">
        <button type="button" class="chip is-active" data-filter="all">全部</button>
        <button type="button" class="chip" data-filter="word">单词</button>
        <button type="button" class="chip" data-filter="sentence">句子</button>
        <button type="button" class="chip" data-filter="grammar">语法</button>
      </div>
      <button type="button" class="primary-btn due-btn hidden" id="dueReviewBtn">今日待复习 <span id="dueCount">0</span></button>
    </section>
    <main class="stage" id="stage">
      <p class="hint" id="hint">看中文释义，直接用键盘输入英文单词</p>
      <p class="prompt" id="prompt"></p>
      <p class="phonetic hidden" id="phonetic"></p>
      <div class="letters" id="letters" aria-live="polite"></div>
      <p class="feedback" id="feedback"></p>
      <div class="grammar hidden" id="grammarBox">
        <details class="lesson hidden" id="lessonBox" open>
          <summary class="lesson-bar" id="lessonBar">语法讲解</summary>
          <div class="lesson-body" id="lessonBody"></div>
        </details>
        <p class="grammar-meta" id="grammarMeta"></p>
        <p class="grammar-q" id="grammarQuestion"></p>
        <p class="grammar-q-zh" id="grammarQuestionZh"></p>
        <div class="options" id="grammarOptions"></div>
        <div class="explain hidden" id="grammarExplain"></div>
        <button type="button" class="primary-btn hidden" id="grammarNext">下一题</button>
      </div>
      <div class="review-list hidden" id="reviewList"></div>
      <p class="empty hidden" id="emptyState"></p>
    </main>
    <section class="stats" aria-label="练习统计">
      <div class="stat stat--violet">
        <span class="stat-label">WPM</span>
        <strong id="statWpm">0</strong>
      </div>
      <div class="stat stat--green">
        <span class="stat-label">正确率</span>
        <strong id="statAcc">100%</strong>
      </div>
      <div class="stat stat--pink">
        <span class="stat-label">已完成</span>
        <strong id="statDone">0</strong>
      </div>
      <div class="stat stat--orange">
        <span class="stat-label">进度</span>
        <strong id="statProgress">0/0</strong>
      </div>
    </section>
    <p class="shortcuts">提示：电脑直接敲键盘 · 输错会标红并重来 · 按 Ctrl 键播放发音 · 手机请点下方输入框</p>
  </div>
  <input
    id="hiddenInput"
    class="hidden-input"
    autocomplete="off"
    autocapitalize="off"
    autocorrect="off"
    spellcheck="false"
    enterkeyhint="done"
    aria-label="英文输入"
  />
  <script src="question_bank/embedded_banks.js"></script>
  <script src="script.js"></script>
</body>
</html>
